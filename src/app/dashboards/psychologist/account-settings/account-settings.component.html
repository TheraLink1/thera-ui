<div class="settings">
  <div class="settings-card">
    <h5 class="settings-title">Account Settings</h5>
    <div class="settings-field">
      <label class="settings-label">Full Name</label>
      <input class="settings-input" type="text" [ngModel]="form().name" (ngModelChange)="form.update(v => ({...v, name: $event}))" name="name" />
    </div>
    <div class="settings-field">
      <label class="settings-label">Specialization</label>
      <input class="settings-input" type="text" [ngModel]="form().Specialization" (ngModelChange)="form.update(v => ({...v, Specialization: $event}))" name="spec" />
    </div>
    <div class="settings-field">
      <label class="settings-label">Location</label>
      <input class="settings-input" type="text" [ngModel]="form().location" (ngModelChange)="form.update(v => ({...v, location: $event}))" name="location" />
    </div>
    <div class="settings-field">
      <label class="settings-label">Hourly Rate (PLN)</label>
      <input class="settings-input input-sm" type="number" [ngModel]="form().hourlyRate" (ngModelChange)="form.update(v => ({...v, hourlyRate: +$event}))" name="rate" />
    </div>
    <div class="settings-field">
      <label class="settings-label">Rating</label>
      <div class="settings-stars">
        @for (s of ratingStars(); track $index) {
          <span class="star" [class.filled]="s === 'full'">&#9733;</span>
        }
      </div>
    </div>
    <div class="settings-field">
      <label class="settings-label">Description</label>
      <textarea class="settings-textarea" [ngModel]="form().Description" (ngModelChange)="form.update(v => ({...v, Description: $event}))" name="desc" rows="4"></textarea>
    </div>
    @if (message()) {
      <p [class]="messageType() === 'success' ? 'msg-success' : 'msg-error'">{{ message() }}</p>
    }
    <div class="settings-actions">
      <button class="settings-btn" (click)="save()" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>
</div>
